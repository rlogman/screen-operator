# Configuracion base del agente. Todo lo que no depende de la superficie ni de la app.
# Orden de resolucion por tarea: base.yaml <- surfaces/<x>.yaml <- apps/<y>.yaml <- overlay de entorno.
# Merge: mapas se fusionan en profundidad, listas y escalares se reemplazan.
version: 1

contract:
  auth:
    scheme: bearer
    token_env: TEAM_TOKEN
  routes:
    health: { method: GET, path: /health }
    create: { method: POST, path: /tasks }
    get: { method: GET, path: "/tasks/{task_id}" }
  request:
    task_field: tarea
    desktop_url_field: escritorio.url
    desktop_secret_fields: [escritorio.password]
  response:
    id_field: task_id
    status_field: estado
    summary_field: resumen
    status_values:
      running: en_curso
      done: terminada
      failed: fallida
  create_timeout_ms: 2000

summary:
  answer_line_prefix: "respuesta: "
  multi_value_separator: "; "
  number_first: true
  omit_answer_when_unanswerable: true
  failure_must_name_identifiers: true
  redact:
    from_request_fields: [escritorio.password]
    from_env: [TEAM_TOKEN, OPENROUTER_API_KEY]
    # Valores vistos en pantalla junto a estas etiquetas se tratan como secretos.
    screen_secret_labels: [clave, contraseña, password, token, api key, secreto]
    replacement: "[redactado]"

budgets:
  task_deadline_s: 300
  safety_margin_s: 30
  max_steps: 60
  max_cost_usd: 0.30

perception:
  screenshot:
    format: jpeg
    jpeg_quality: 80
    max_width: 1280
  zoom:
    enabled: true
    factor: 2
    max_per_step: 1

models:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # Candidatos a comparar en el harness (precios OpenRouter 2026-10-10, US$ por M tokens in/out):
  #   actor:    openai/gpt-4o-mini (0.15/0.60), anthropic/claude-haiku-5.5 (0.10/0.50)
  #   grounder: bytedance/ui-tars-1.5-7b (0.10/0.20)
  # Timeout por intento y reintentos ante 429/5xx/red (backoff 0,5 s, 1 s, ...).
  call_timeout_s: 40
  max_retries: 2
  # Los precios se usan solo si la respuesta no trae usage.cost (OpenRouter lo trae siempre).
  # Medido 2026-10-10 con una captura 1280x800 (TestE6_1_S5, OpenRouter):
  #   openai/gpt-4o-mini        36.884 tokens de entrada, US$ 0,0056 por captura
  #   anthropic/claude-haiku-5.5 1.412 tokens de entrada, US$ 0,00019 por captura
  #   google/gemini-3.8-flash    1.131 tokens de entrada, US$ 0,0012 por captura (0.75/3.75)
  #   anthropic/claude-sonnet-5.5 1.412 tokens de entrada, US$ 0,0036 por captura (2/10)
  # gpt-4o-mini cuenta la imagen ~26 veces mas cara: 40 pasos romperian el techo de US$ 0,04.
  # verifier: extraccion de filas y relectura (salida mas larga).
  roles:
    actor: { model: anthropic/claude-haiku-5.5, temperature: 0, max_tokens: 1000, reasoning_effort: none, price_in_usd_per_mtok: 0.10, price_out_usd_per_mtok: 0.50 }
    verifier: { model: anthropic/claude-haiku-5.5, temperature: 0, max_tokens: 4000, reasoning_effort: none, price_in_usd_per_mtok: 0.10, price_out_usd_per_mtok: 0.50 }
    # Epica 8.2 (docs/model-selection.md): Sonnet 5.5 decide solo los pasos trabados.
    # Sonnet y Gemini 3.8 Flash rechazan reasoning_effort none (HTTP 400); minimal da 0 tokens de razonamiento.
    escalation: { model: anthropic/claude-sonnet-5.5, temperature: 0, max_tokens: 1000, reasoning_effort: minimal, price_in_usd_per_mtok: 2.00, price_out_usd_per_mtok: 10.00 }
  # Escalamiento: disparadores, N pasos en la misma fase, maximo de pasos escalados y tope de costo por tarea.
  escalation:
    triggers: [sin_efecto, cierre_rechazado, sin_avance]
    stall_steps: 6
    max_steps: 4
    max_task_cost_usd: 0.05

policy:
  today_source: app
  ambiguity:
    on_multiple_matches: fail
    name_identifiers_in_reason: true
  writes:
    check_existing_before_create: true
    verify_after_write: true
    never_resubmit_without_verify: true
  destructive:
    bulk_changes: fail
    keywords: [eliminar, borrar, anular, cancelar, vaciar, todos, todas]
    require_unique_target: true
  unknown_values: fail
  stop_on_report: true

# Hints de app opcionales. Vacio = agente generico que aprende la app dentro de la tarea.
app: {}
